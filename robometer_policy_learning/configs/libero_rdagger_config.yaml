defaults:
  - algorithm@offline_algorithm: dp  # must match the STUDENT actor type in load_dir (bc|dp)
  - reward_model: null
  - policy@policy: transformer

debug: false

load_dir: /scr/liryan/robometer_policy_learning/outputs/2026-07-03/20-19-13  # Student policy dir
checkpoint: 50000  # student: 68% eval

rdagger:
  expert_dir: /scr/liryan/robometer_policy_learning/outputs/2026-07-03/20-19-13
  expert_checkpoint: 70000  # expert: 92% eval
  reward_model: jesbu1/robometer-4b-fft-libero  # LIBERO-finetuned ckpt 

  # Gating. NOTE: thresholds are method-dependent.
  # spearman/pearson -> correlation in [-1, 1]
  # naive            -> raw progress deltas in [0, 1]
  method: spearman
  short_window: 5
  drop_threshold: -0.5
  long_window: 30
  plateau_threshold: 0.3
  min_drop_magnitude: 0.1
  smoothing: 0.0  # EMA weight on history, [0, 1); 0 = off
  warmup_steps: 15
  score_every: 1

  # Expert
  expert_k: 40  # steps the expert keeps control after a gate fire ('fixed' mode)
  expert_n_action_steps: 5
  expert_exit_mode: fixed  # fixed | takeover | progress | gate
  recovery_delta: 0.2      # 'progress': rise above takeover progress to hand back
  min_expert_steps: 5      # 'progress'/'gate': min hold before condition handback
  max_expert_steps: 80     # 'progress'/'gate': hard cap (stuck-expert guardrail)

  # DAgger
  num_iterations: 10
  rollouts_per_iter: 5
  train_steps_per_iter: 2000
  use_offline: true  # mix offline demos with gated online data
  store_only_expert: false
  require_intervention: false 
  require_success: false
  reweighting: null
  save_interval: 1
  online_buffer_capacity: 200000
  seed: 0

# Algorithm used to continue training the student
alg:
  offline_alg_name: dp
  online_alg_name: null

# Eval
eval:
  eval_freq: 10000
  eval_num_episodes: 25
  eval_record_video: true
  eval_on_first_step: false

# Logging
logging:
  wandb_project: libero_rdagger
  wandb_entity: liryan-usc
  wandb_offline: false
  wandb_log_dir_base: logs/wandb
  wandb_name: "rdagger_dp_task_5"
  log_level: "INFO"
