defaults:
  - algorithm@offline_algorithm: dp
  - reward_model: null
  - policy@policy: transformer

debug: true  # record collection episodes + per-intervention Robometer progress plots

load_dir: /scr/liryan/robometer_policy_learning/outputs/2026-07-07/19-17-11  # task-5 DP student
checkpoint: 10000  # ~54% ungated success

# env/training/model/policy adopted from <load_dir>/.hydra (task_id=5, n_act=2).
# NOTE: task 5's failures are TERMINAL -- the book flops flat and no policy can
# recover it. This arm is the CONTROL that proves the scope condition, not a task
# any gate is expected to win on. Expect flat or negative deltas here.

rdagger:
  gate_type: robometer
  expert_type: pi0
  pi0_checkpoint: ~/.cache/openpi/openpi-assets/checkpoints/pi0_libero
  expert_dir: null
  expert_checkpoint: null

  reward_model: jesbu1/robometer-4b-fft-libero

  # Gate: the single config tuned jointly on all four tasks (transfer study, delta 0.02). On a
  # fifth task it never tuned on it costs 1.9% latency against that task's own frontier, so this is
  # the config the paper ships. Not task 5's own tuned config, on purpose.
  method: spearman
  short_window: 75
  drop_threshold: -0.9
  long_window: 225
  plateau_threshold: 0.0
  min_drop_magnitude: 0.0
  smoothing: 0.0
  score_every: 1

  expert_n_action_steps: 5

  # DAgger -- winning expert-only recipe (offline demos + expert intervention segments only):
  num_iterations: 10
  expert_transitions_per_iter: 1500
  train_steps_per_iter: 2000
  use_offline: true
  offline_sample_ratio: 0.25

  store_only_expert: true
  reweighting: null
  iwr_target_intv: 0.8

  require_success: true
  require_intervention: true

  save_interval: 1
  online_buffer_capacity: 200000
  seed: 0

offline_algorithm:
  use_weighted_bc: false

alg:
  offline_alg_name: dp
  online_alg_name: null

eval:
  eval_num_episodes: 50
  eval_record_video: true
  eval_on_first_step: true

logging:
  wandb_project: libero_rdagger
  wandb_entity: liryan-usc
  wandb_offline: false
  wandb_log_dir_base: logs/wandb
  wandb_name: "rdagger_dp_task5_expert_only"
  log_level: "INFO"
