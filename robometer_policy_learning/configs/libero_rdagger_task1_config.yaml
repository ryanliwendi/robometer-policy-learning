defaults:
  - algorithm@offline_algorithm: dp  # must match the student actor type 
  - reward_model: null
  - policy@policy: transformer

debug: false

load_dir: /scr/liryan/robometer_policy_learning/outputs/2026-07-12/20-06-31  # Student policy dir
checkpoint: 50000  # 64% success rate

rdagger:
  expert_type: pi0  # 88% success rate
  pi0_checkpoint: ~/.cache/openpi/openpi-assets/checkpoints/pi0_libero
  expert_dir: null        # unused when expert_type=pi0
  expert_checkpoint: null

  reward_model: jesbu1/robometer-4b-fft-libero  # LIBERO-finetuned ckpt

  # Gating
  method: spearman
  short_window: 50
  drop_threshold: -0.9
  long_window: 250
  plateau_threshold: 0.1
  min_drop_magnitude: 0.1
  smoothing: 0.0
  score_every: 1

  expert_n_action_steps: 5

  # DAgger
  num_iterations: 10
  rollouts_per_iter: 10
  train_steps_per_iter: 2000
  use_offline: true         # mixing with the original demos
  offline_sample_ratio: 0.25

  # Expert-only training recipe, held IDENTICAL across all four task-1 arms (rdagger, diffdagger,
  # thriftydagger, hgdagger) so a policy difference is attributable to the GATE alone. Only the
  # gate-selected corrections train the policy; no clean student successes, no IWR reweighting.
  # (Was store_only_expert=false + reweighting=iwr; that made rdagger the odd one out and made
  # cross-arm comparison contestable. HG-DAgger cannot keep clean successes at all -- an episode
  # is kept only when the human intervened AND the rescue succeeded -- so expert-only is the one
  # recipe all four arms can actually run.)
  store_only_expert: true
  reweighting: null
  iwr_target_intv: 0.8      # inert while reweighting=null

  require_success: true
  require_intervention: true

  save_interval: 1
  online_buffer_capacity: 200000
  seed: 0

offline_algorithm:
  use_weighted_bc: false

# Algorithm used to continue training the student
alg:
  offline_alg_name: dp
  online_alg_name: null

# Eval
eval:
  eval_freq: 10000
  eval_num_episodes: 25
  eval_record_video: true
  eval_on_first_step: true

# Logging
logging:
  wandb_project: libero_rdagger
  wandb_entity: liryan-usc
  wandb_offline: false
  wandb_log_dir_base: logs/wandb
  wandb_name: "rdagger_dp_task1_pi0_expertonly_takeover"
  log_level: "INFO"
