# Example usage: 
# srun --gres=shard:8 --mem=48G --time=12:00:00 --pty \
#  uv run python scripts/train_dagger.py \
#    --config-name libero_hgdagger_task1_config

defaults:
  - algorithm@offline_algorithm: dp  # must match the student actor type
  - reward_model: null
  - policy@policy: transformer

debug: false

load_dir: /scr/liryan/robometer_policy_learning/outputs/task1_dp_50k/20-06-31
checkpoint: 50000 

rdagger:
  gate_type: hgdagger
  hg_backend: replay  # 'live' = real-time spacebar, needs a display; 'replay' = the two-pass loop

  expert_type: pi0
  pi0_checkpoint: ~/.cache/openpi/openpi-assets/checkpoints/pi0_libero
  expert_dir: null
  expert_checkpoint: null

  reward_model: null

  expert_n_action_steps: 5

  # Identical to the Robometer and Diff-DAgger arms.
  num_iterations: 10
  rollouts_per_iter: 10
  train_steps_per_iter: 2000
  use_offline: true
  offline_sample_ratio: 0.25

  store_only_expert: true
  reweighting: null

  require_success: true
  require_intervention: true

  save_interval: 1
  online_buffer_capacity: 200000
  seed: 0

offline_algorithm:
  use_weighted_bc: false

alg:
  offline_alg_name: dp
  online_alg_name: null

eval:
  eval_freq: 10000
  eval_num_episodes: 25
  eval_record_video: true
  eval_on_first_step: false

logging:
  wandb_project: libero_rdagger
  wandb_entity: liryan-usc
  wandb_offline: false
  wandb_log_dir_base: logs/wandb
  wandb_name: "hgdagger_dp_task1_baseline"
  log_level: "INFO"
